version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /assets/remotion-template
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
    groups:
      remotion-template:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /assets/remotion-template
    schedule:
      interval: monthly
    labels:
      - dependencies
      - python
    groups:
      remotion-template-python:
        patterns:
          - "*"
